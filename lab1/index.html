<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/script.js"></script>
</head>
<body>
  <main class="page">
    <section class="controls">
      <label id="button-count-label" for="button-count"></label>
      <div class="input-row">
        <input id="button-count" type="number" min="3" max="7">
        <button id="start-button" type="button"></button>
      </div>
      <p id="message" class="message" aria-live="polite"></p>
    </section>

    <section id="game-area" class="game-area"></section>
  </main>
</body>
</html>
